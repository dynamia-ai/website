<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAMi</title>
<style>
  html,body,svg { width:100%; height:100%; margin:0; display:block; overflow:hidden }
  .signal { opacity:0; animation:signal 1.25s var(--delay) ease-out both }
  .trace { fill:none; stroke:#d1fa6a; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:.23 1; stroke-dashoffset:.24; opacity:0; animation:trace 1.4s var(--delay) ease-in-out both }
  .cover { animation:uncover .45s var(--delay) both }
  .wipe { transform-box:fill-box; transform-origin:right; animation:wipe .85s var(--delay) both }
  .rise { transform-box:fill-box; transform-origin:top; animation:wipe-y .75s var(--delay) both }
  .blocked-task { animation:bump .76s var(--delay) both }
  .fan { animation:spin 3.2s linear infinite }
  .bar-fill { animation:fill-bar .85s var(--delay) ease-out both }
  @keyframes bump {
    0%,100% { transform:translateX(0) }
    34% { transform:translateX(var(--travel)); animation-timing-function:ease-out }
    66% { transform:translateX(-5px); animation-timing-function:ease-in-out }
  }
  @keyframes spin { to { transform:rotate(360deg) } }
  @keyframes fill-bar { from { clip-path:inset(0 100% 0 0) } to { clip-path:inset(0) } }
  @keyframes signal { 35% { opacity:.92 } 72% { opacity:.68 } }
  @keyframes trace { 15%,75% { opacity:1 } 100% { stroke-dashoffset:-1 } }
  @keyframes uncover { 0% { opacity:1 } 100% { opacity:0 } }
  @keyframes wipe { from { transform:scaleX(1) } to { transform:scaleX(0) } }
  @keyframes wipe-y { from { transform:scaleY(1) } to { transform:scaleY(0) } }
  @media(prefers-reduced-motion:reduce) {
    .fan,.bar-fill,.blocked-task { animation:none }
    .signal,.trace,.cover,.wipe,.rise { animation:none; opacity:0 }
  }
</style>
</head>
<body>
<script src="revised-labels.js"></script>
<script src="revised-motion.js"></script>
</body>
</html>
